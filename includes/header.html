<!-- Consultation Modal -->
<div id="consultationModal" class="consultation-modal">
  <div class="consultation-modal-content">
    <button class="consultation-modal-close" id="closeModal">&times;</button>
    <div class="consultation-modal-header">
      <h2>Schedule a Free Consultation</h2>
      <p>Let's discuss how we can help optimize your operations</p>
    </div>
    <div class="consultation-modal-body">
      <form id="consultation-form" class="consultation-form">
        <div class="row">
          <div class="col-md-6 form-group">
            <input type="text" name="from_name" class="form-control" placeholder="Your Name" required>
          </div>
          <div class="col-md-6 form-group mt-3 mt-md-0">
            <input type="email" class="form-control" name="from_email" placeholder="Your Email" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 form-group mt-3">
            <input type="tel" class="form-control" name="phone" placeholder="Your Phone Number (Optional)">
          </div>
          <div class="col-md-6 form-group mt-3">
            <input type="text" class="form-control" name="subject" placeholder="Subject" required>
          </div>
        </div>
        <div class="form-group mt-3">
          <textarea class="form-control" name="message" rows="5" placeholder="Tell us about your needs" required></textarea>
        </div>
        <div class="my-3">
          <div class="loading">Sending...</div>
          <div class="error-message"></div>
          <div class="sent-message">Your message has been sent successfully. We'll contact you soon!</div>
        </div>
        <div class="text-center"><button type="submit">Send Request</button></div>
      </form>
    </div>
  </div>
</div<a href="contact.html" class="custom-menu-item" data-page="contact">Contact</a>

    </div>
