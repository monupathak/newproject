<script>
  // Wait a bit for header to be fully rendered in DOM
  setTimeout(function() {
    const mobileMenuBtn = document.getElementById('customMobileMenuBtn');
    const mobileMenu = document.getElementById('customMobileMenu');
    const mobileMenuClose = document.getElementById('customMobileMenuClose');
    const menuItems = document.querySelectorAll('.custom-menu-item');
    const submenuToggles = document.querySelectorAll('.custom-submenu-toggle');

    console.log('Mobile menu elements:', { mobileMenuBtn, mobileMenu, mobileMenuClose });

    // Open menu
    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        console.log('Mobile menu button clicked');
        if (mobileMenu) {
          mobileMenu.classList.add('active');
          document.body.style.overflow = 'hidden';
          console.log('Mobile menu opened');
        }
      });
    } else {
      console.error('Mobile menu button not found!');
    }

    // Close menu
    if (mobileMenuClose) {
      mobileMenuClose.addEventListener('click', function(e) {
        e.preventDefault();
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      });
    }

    // Toggle submenu
    submenuToggles.forEach(toggle => {
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const submenu = this.nextElementSibling;
        submenu.classList.toggle('active');
        this.classList.toggle('active');
      });
    });

    // Close menu when clicking on a main menu item
    menuItems.forEach(item => {
      item.addEventListener('click', function() {
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      });
    });

    // Close menu when clicking on submenu item
    document.querySelectorAll('.custom-submenu-item').forEach(item => {
      item.addEventListener('click', function() {
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      });
    });

    // Close menu when clicking outside
    if (mobileMenu) {
      mobileMenu.addEventListener('click', function(e) {
        if (e.target === mobileMenu) {
          mobileMenu.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    }

    // ========== Consultation Modal Functionality ==========
    const consultationBtn = document.getElementById('consultationBtn');
    const consultationBtnMobile = document.getElementById('consultationBtnMobile');
    const consultationModal = document.getElementById('consultationModal');
    const closeModal = document.getElementById('closeModal');
    const consultationForm = document.getElementById('consultation-form');

    // Open modal - Desktop button
    if (consultationBtn) {
      consultationBtn.addEventListener('click', function(e) {
        e.preventDefault();
        consultationModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    }

    // Open modal - Mobile button
    if (consultationBtnMobile) {
      consultationBtnMobile.addEventListener('click', function(e) {
        e.preventDefault();
        consultationModal.classList.add('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = 'hidden';
      });
    }

    // Close modal - Close button
    if (closeModal) {
      closeModal.addEventListener('click', function() {
        consultationModal.classList.remove('active');
        document.body.style.overflow = '';
      });
    }

    // Close modal - Click outside
    if (consultationModal) {
      consultationModal.addEventListener('click', function(e) {
        if (e.target === consultationModal) {
          consultationModal.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    }

    // Initialize EmailJS
    emailjs.init({
      publicKey: 'AXDZDscSvLQWGh4kv',
    });

    // Handle consultation form submission
    if (consultationForm) {
      consultationForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const loadingDiv = consultationForm.querySelector('.loading');
        const errorDiv = consultationForm.querySelector('.error-message');
        const sentDiv = consultationForm.querySelector('.sent-message');
        const submitBtn = consultationForm.querySelector('button[type="submit"]');

        // Show loading
        loadingDiv.style.display = 'block';
        errorDiv.style.display = 'none';
        sentDiv.style.display = 'none';
        submitBtn.disabled = true;

        // Prepare template parameters
        const templateParams = {
          from_name: consultationForm.querySelector('input[name="from_name"]').value,
          from_email: consultationForm.querySelector('input[name="from_email"]').value,
          phone: consultationForm.querySelector('input[name="phone"]').value || 'Not provided',
          subject: consultationForm.querySelector('input[name="subject"]').value,
          message: consultationForm.querySelector('textarea[name="message"]').value,
          form_type: 'Free Consultation Request'
        };

        // Send email using EmailJS
        emailjs.send('service_0y254vt', 'template_oi5kroa', templateParams)
          .then(function(response) {
            console.log('SUCCESS!', response.status, response.text);
            
            // Send auto-reply to user
            emailjs.send('service_0y254vt', 'template_laduxgr', {
              to_email: templateParams.from_email,
              to_name: templateParams.from_name
            }).then(function(autoReplyResponse) {
              console.log('Auto-reply sent!', autoReplyResponse.status);
            }).catch(function(autoReplyError) {
              console.log('Auto-reply failed (non-critical):', autoReplyError);
            });
            
            loadingDiv.style.display = 'none';
            sentDiv.style.display = 'block';
            submitBtn.disabled = false;
            
            // Reset form
            consultationForm.reset();
            
            // Close modal after 2 seconds
            setTimeout(function() {
              consultationModal.classList.remove('active');
              document.body.style.overflow = '';
              sentDiv.style.display = 'none';
            }, 2000);
          }, function(error) {
            console.log('FAILED...', error);
            loadingDiv.style.display = 'none';
            errorDiv.textContent = 'Failed to send message. Please try again or email us directly at contact@supplyopt.com';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
          });
      });
    }

    // Handle contact form submission (if on contact page)
    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const loadingDiv = contactForm.querySelector('.loading');
        const errorDiv = contactForm.querySelector('.error-message');
        const sentDiv = contactForm.querySelector('.sent-message');
        const submitBtn = contactForm.querySelector('button[type="submit"]');

        // Show loading
        loadingDiv.classList.add('d-block');
        errorDiv.classList.remove('d-block');
        sentDiv.classList.remove('d-block');
        submitBtn.disabled = true;

        // Prepare template parameters
        const templateParams = {
          from_name: contactForm.querySelector('input[name="from_name"]').value,
          from_email: contactForm.querySelector('input[name="from_email"]').value,
          phone: contactForm.querySelector('input[name="phone"]').value || 'Not provided',
          subject: contactForm.querySelector('input[name="subject"]').value,
          message: contactForm.querySelector('textarea[name="message"]').value,
          form_type: 'Contact Form'
        };

        // Send email using EmailJS
        emailjs.send('service_0y254vt', 'template_oi5kroa', templateParams)
          .then(function(response) {
            console.log('SUCCESS!', response.status, response.text);
            
            // Send auto-reply to user
            emailjs.send('service_0y254vt', 'template_laduxgr', {
              to_email: templateParams.from_email,
              to_name: templateParams.from_name
            }).then(function(autoReplyResponse) {
              console.log('Auto-reply sent!', autoReplyResponse.status);
            }).catch(function(autoReplyError) {
              console.log('Auto-reply failed (non-critical):', autoReplyError);
            });
            
            loadingDiv.classList.remove('d-block');
            sentDiv.classList.add('d-block');
            submitBtn.disabled = false;
            
            // Reset form
            contactForm.reset();
          }, function(error) {
            console.log('FAILED...', error);
            loadingDiv.classList.remove('d-block');
            errorDiv.textContent = 'Failed to send message. Please try again or email us directly at contact@supplyopt.com';
            errorDiv.classList.add('d-block');
            submitBtn.disabled = false;
          });
      });
    }

  }, 100); // Small delay to ensure DOM is ready
</script>
